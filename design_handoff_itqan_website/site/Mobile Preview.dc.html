<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600&amp;display=swap">
<style>body{margin:0;background:#1c1620;font-family:"Host Grotesk",system-ui,sans-serif}</style>
</helmet>
<section style="padding:40px 44px;display:flex;flex-direction:column;gap:24px">
  <div style="display:flex;align-items:baseline;gap:14px;color:#f3efe8"><span style="font:600 22px/1 'Host Grotesk'">Itqan — mobile (390 × 844)</span><span style="font:400 14px 'Host Grotesk';color:#a9a0b2">Live pages. Scroll inside each phone; tap Menu, Light/Dark, filters and cards.</span></div>
  <div style="display:flex;flex-wrap:wrap;gap:36px;align-items:flex-start">
    <sc-for list="{{ screens }}" as="s" hint-placeholder-count="6">
      <figure style="margin:0;display:flex;flex-direction:column;gap:12px">
        <figcaption style="font:500 13px 'Host Grotesk';color:#a9a0b2">{{ s.label }}</figcaption>
        <div style="width:414px;height:868px;padding:12px;border-radius:52px;background:#050307;box-shadow:0 0 0 1px #3a3040,0 40px 80px -30px rgba(0,0,0,.7)">
          <iframe src="{{ s.src }}" title="{{ s.label }} on mobile" loading="lazy" style="width:390px;height:844px;border:0;border-radius:40px;background:#0e0a12;display:block"></iframe>
        </div>
      </figure>
    </sc-for>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return { screens: [
      ["Home", "home/Home.dc.html"], ["Products", "products/Products.dc.html"], ["Product · Etoria", "products/Product.dc.html?p=etoria"],
      ["About Us", "about/About.dc.html"], ["Business Cooperation", "business-cooperation/Cooperation.dc.html"], ["Contact Us", "contact/Contact.dc.html?type=cooperation"]
    ].map(([label, src]) => ({ label, src })) };
  }
}
</script>
</body>
</html>
