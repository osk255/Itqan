<style>html,body{margin:0;height:100%;background:#f1ede6}three-d-stage:not(:defined){visibility:hidden}three-d-stage{display:block;width:100vw;height:100vh}</style>
</head>
<body>
<three-d-stage name="itqan-logo" background="#f1ede6" autorotate></three-d-stage>
<script src="three-d-stage.js"></script>
<script type="module">
import { sampleLogo, buildLogoGroup } from "../shared/logo-voxels.js";
const stage = document.querySelector("three-d-stage");
const { THREE } = await stage.ready;
const img = new Image(); img.src = "../assets/brand/logo.png"; await img.decode();
stage.setObject(buildLogoGroup(THREE, sampleLogo(img, 160)));
</script>
</body>
