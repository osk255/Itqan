# Netlify configuration: Itqan website (Next.js static export).
#
# `npm run build` pre-renders every page to plain HTML in out/, which Netlify
# serves from its CDN. There is no server runtime (docs/DECISIONS.md ADR-006).
# The design prototype stays in design_handoff_itqan_website/ as the visual
# reference and is no longer deployed.

[build]
  # Lint, then `next build` (includes the TypeScript check), then the post-build
  # quality gate (scripts/check-site.mjs). Any failure stops the deploy and the
  # previous deploy stays live.
  command = "npm run lint && npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # Netlify auto-installs its Next.js adapter for Next projects. A static export
  # needs none of it, and the adapter expects to publish .next/, so skip it and
  # publish out/ as plain static files.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# ---------------------------------------------------------------------------
# Redirects. Canonical URLs follow the live itqanpharma.com (ADR-005).
# Live-site URLs that change are mapped in docs/seo/REDIRECT_MAP.md.
# ---------------------------------------------------------------------------

# Short aliases named in the project directive.
[[redirects]]
  from = "/about"
  to = "/about-us/"
  status = 301
[[redirects]]
  from = "/contact"
  to = "/contact-us/"
  status = 301
[[redirects]]
  from = "/products"
  to = "/all-products/"
  status = 301

# Live itqanpharma.com URLs whose new address differs, confirmed so far (from
# search-result snippets, 2026-09-25). The full map needs the Phase 3 crawl:
# docs/seo/REDIRECT_MAP.md. Old product pages were /product/<name-strengths>/.
[[redirects]]
  from = "/product/etoria-60-90-120mg/"
  to = "/products/etoria/"
  status = 301
[[redirects]]
  from = "/product/vertiloc-8-16-24-mg/"
  to = "/products/vertiloc/"
  status = 301
[[redirects]]
  from = "/become-a-partner/"
  to = "/contact-us/?type=cooperation"
  status = 301

# Links shared during the Phase 1 prototype preview keep working.
[[redirects]]
  from = "/home/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/about/About.dc.html"
  to = "/about-us/"
  status = 301
[[redirects]]
  from = "/products/Products.dc.html"
  to = "/product-category/:c/"
  status = 301
  query = { c = ":c" }
[[redirects]]
  from = "/products/Products.dc.html"
  to = "/all-products/"
  status = 301
[[redirects]]
  from = "/products/Product.dc.html"
  to = "/products/:p/"
  status = 301
  query = { p = ":p" }
[[redirects]]
  from = "/products/Product.dc.html"
  to = "/all-products/"
  status = 301
[[redirects]]
  from = "/business-cooperation/Cooperation.dc.html"
  to = "/business-cooperation/"
  status = 301
[[redirects]]
  from = "/contact/Contact.dc.html"
  to = "/contact-us/"
  status = 301
[[redirects]]
  from = "/brand/Brand.dc.html"
  to = "/brand/"
  status = 301
[[redirects]]
  from = "/mobile"
  to = "/"
  status = 301

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    # Preview only: keep every deploy out of search indexes until the site
    # launches on itqanpharma.com. Remove at cutover (docs/seo/LAUNCH_CHECKLIST.md).
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Next.js build assets and fonts have content hashes in their names.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Optimised images are not fingerprinted: cache for a day, then revalidate.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
